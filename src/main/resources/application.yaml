server:
  port: 8080
spring:
  application:
    name: ApiGateway
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/users/**, /payment-cards/**
          filters:
            - Auth

        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/**

        - id: order-service-route
          uri: ${ORDER_SERVICE_URL}
          predicates:
            - Path=/orders/**, /items/**
          filters:
            - Auth

        - id: payment-service-route
          uri: ${PAYMENT_SERVICE_URL}
          predicates:
            - Path=/payments/**
          filters:
            - Auth