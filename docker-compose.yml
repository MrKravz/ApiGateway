networks:
  app-network:
    driver: bridge

volumes:
  user-postgres-data:
  auth-postgres-data:
  order-postgres-data:
  mongodb_data:

services:
  user-postgres:
    image: postgres:15-alpine
    container_name: user-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "${USER_DB_PORT}:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  auth-postgres:
    image: postgres:15-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  order-postgres:
    image: postgres:15-alpine
    container_name: order-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "${ORDER_DB_PORT}:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - app-network

  mongodb:
    image: mongo:6
    container_name: mongo-payment
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-service
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-service
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-service:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  user-service:
    build:
      context: ../UserService
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    depends_on:
      - user-postgres
      - redis
    ports:
      - "${USER_SERVICE_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_DOCKER_URL: ${USER_DB_DOCKER_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    networks:
      - app-network

  auth-service:
    build:
      context: ../AuthenticationService
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      - auth-postgres
      - user-service
    ports:
      - "${AUTH_SERVICE_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_DOCKER_URL: ${AUTH_DB_DOCKER_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      USER_SERVICE_URL: ${INTERNAL_USER_SERVICE_URL}
    networks:
      - app-network

  order-service:
    build:
      context: ../OrderService
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    depends_on:
      order-postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started
    ports:
      - "${ORDER_SERVICE_PORT}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_DOCKER_URL: ${ORDER_DB_DOCKER_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      USER_SERVICE_URL: ${EXTERNAL_USER_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}
      TOPIC_NAME: ${TOPIC_NAME}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - app-network

  bank-mock-service:
    build:
      context: ../BankApiMockService
      dockerfile: Dockerfile
    container_name: bank-mock-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    networks:
      - app-network

  payment-service:
    build:
      context: ../PaymentService
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_healthy
      bank-mock-service:
        condition: service_started
    ports:
      - "${PAYMENT_SERVICE_PORT}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DOCKER_SPRING_MONGODB_URI: ${DOCKER_SPRING_MONGODB_URI}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}
      DOCKER_EXTERNAL_SERVICE_URL: ${DOCKER_EXTERNAL_SERVICE_URL}
      TOPIC_NAME: ${TOPIC_NAME}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - app-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - user-service
      - auth-service
      - order-service
      - payment-service
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - app-network